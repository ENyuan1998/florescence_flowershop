<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 花禾子 - 門市銷售結帳系統 (雲端連線版)</title>
    <style>
        :root { --primary: #ffb6c1; --primary-dark: #ff91a4; --bg: #fff5f6; --text: #4a4a4a; --card-border: #ffe4e8; --flower-color: #d16174; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .container { background: white; padding: 20px 15px; border-radius: 16px; box-shadow: 0 8px 24px rgba(255, 182, 193, 0.2); max-width: 600px; margin: 0 auto; }
        h1 { color: #d16174; margin: 0 0 15px 0; font-size: 1.5em; text-align: center; border-bottom: 2px dashed var(--card-border); padding-bottom: 10px; }
        .sync-banner { background: #e8f5e9; color: #2e7d32; padding: 8px; border-radius: 8px; font-size: 0.85em; text-align: center; margin-bottom: 15px; font-weight: bold; }
        .section-title { font-size: 1.05em; font-weight: bold; color: #b83b5e; margin: 15px 0 8px 0; border-left: 3px solid var(--primary-dark); padding-left: 6px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; color: #555; }
        select, input[type="text"], input[type="number"] { padding: 10px; border: 1px solid #ffccd5; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 1em; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 8px; background: #fffafb; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); }
        .checkbox-group input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
        .btn { background-color: #ff91a4; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1em; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background-color: var(--primary-dark); }
        .cart-list { border-top: 1px solid #ffe4e8; margin-top: 15px; padding-top: 10px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #fffafb; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--card-border); }
        .item-info { flex: 1; } .item-name { font-weight: bold; color: #333; } .item-meta { font-size: 0.85em; color: #888; }
        .btn-del { background: #ffe4e8; color: #b83b5e; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .total-box-v2 { margin-top: 15px; padding: 15px; background: #fff0f2; border-radius: 12px; border: 1px dashed #ffccd5; }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.95em; color: #666; }
        .total-row.grand-highlight { border-top: 1px solid #ffccd5; margin-top: 10px; padding-top: 10px; font-size: 1.2em; font-weight: 900; color: #b83b5e; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 花禾子 - 門市銷售結帳系統 (雲端連線版)</h1>
    <div class="sync-banner" id="syncStatus">⏳ 正在連線中央雲端總部...</div>

    <div class="section-title">👤 客戶基本資料</div>
    <div class="grid-2">
        <div class="form-group"><label>客戶姓名：</label><input type="text" id="custName" placeholder="例如：王小明"></div>
        <div class="form-group"><label>聯絡電話：</label><input type="text" id="custPhone" placeholder="例如：0912345678"></div>
    </div>

    <div class="section-title">🌸 選擇購買花材內容 (不含包材)</div>
    <div class="form-group">
        <label>選擇花材品項：</label>
        <select id="itemSelect" onchange="updateStockHint()"></select>
        <span id="stockHint" class="stock-warn"></span>
    </div>
    <div class="form-group">
        <label>🔢 購買數量 (支)：</label>
        <input type="number" id="buyQty" value="1" min="1">
    </div>
    <button class="btn" style="background-color: #fce38a; color: #333;" onclick="addToCart()">＋ 加入本次購物明細</button>

    <div class="section-title">📦 外包裝客製需求</div>
    <div class="checkbox-group">
        <input type="checkbox" id="needPackage" onchange="togglePackageColor(); calculateGrandTotal();">
        <label for="needPackage" style="margin:0; cursor:pointer;">需要外包裝</label>
    </div>
    
    <div id="packageFieldsGroup" style="display:none; margin-top:8px; border-left: 3px solid #ff91a4; padding-left: 10px;">
        <div class="grid-2">
            <div class="form-group">
                <label>🎨 指定外包裝色系：</label>
                <input type="text" id="packageColor" placeholder="油畫粉白色、極簡北歐風">
            </div>
            <div class="form-group">
                <label>💰 外包裝客製金額 ($)：</label>
                <input type="number" id="packagePrice" value="300" min="0" oninput="calculateGrandTotal()">
            </div>
        </div>
    </div>

    <div class="checkbox-group" style="margin-top: 8px;">
        <input type="checkbox" id="needBag" onchange="calculateGrandTotal()">
        <label for="needBag" style="margin:0; cursor:pointer;">加購透明提袋 (50元)</label>
    </div>

    <div class="section-title">📝 本次挑選花材清單</div>
    <div class="cart-list" id="cartContainer">
        <p style="text-align:center; color:#999; font-size:0.9em;">尚未選擇花材品項 🌸</p>
    </div>
    
    <div class="total-box-v2">
        <div class="total-row"><span>1. 花材總計：</span><span>$<span id="lblFlowerTotal">0</span> 元</span></div>
        <div class="total-row"><span>2. 包裝費用：</span><span>$<span id="lblPackageTotal">0</span> 元</span></div>
        <div class="total-row"><span>3. 提袋費用：</span><span>$<span id="lblBagTotal">0</span> 元</span></div>
        <div class="total-row grand-highlight"><span>4. 花束總計：</span><span>$<span id="grandTotal">0</span> 元</span></div>
    </div>

    <button class="btn" style="background: #e53e3e; margin-top:20px; font-size:1.1em; padding:14px;" onclick="submitCheckout()">🔔 送出訂單（即時扣減雲端庫存）</button>
</div>

<script>
const CLOUD_API = 'https://script.google.com/macros/s/AKfycbyAzNbseLWPoacirrXFcaFz5rRy77XsXzvhrKevqTsA2YkfxbCfm_Ryhu3HOV7TMJKUUQ/exec';
const SPREADSHEET_ID = '1uVdZk4g4WDKgiOB76avI2Mt0Os8FNhrCSTg9dfZ5Q2w';
const API_KEY = 'AIzaSyAUCyj5LdQy88oAGls46BId7vJVvyveyRE';

let dbItems = {}; let cart = [];

async function loadCloudStock() {
    try {
        const cloudRes = await fetch(CLOUD_API).then(r => r.json());
        let currentStock = cloudRes.currentStock || {};

        const urlLedger = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/進貨紀錄?key=${API_KEY}`;
        const resLedger = await fetch(urlLedger).then(r => r.json());
        let latestPrices = {};
        
        if (resLedger.values && resLedger.values.length > 1) {
            for (let i = 1; i < resLedger.values.length; i++) {
                const row = resLedger.values[i]; 
                if(row.length < 9 || row[1] !== 'flower') continue; 
                latestPrices[row[3].trim()] = Math.round(parseFloat(row[7] || 0) * 3); 
            }
        }
        
        dbItems = {};
        Object.keys(latestPrices).forEach(name => { 
            dbItems[name] = { 
                price: latestPrices[name], 
                stock: currentStock[name] !== undefined ? parseFloat(currentStock[name]) : 0 
            }; 
        });
        renderSelect();
        document.getElementById('syncStatus').innerText = '☁️ 雲端核心網絡對接成功！';
    } catch(e) { 
        document.getElementById('syncStatus').innerText = '⚠️ 雲端握手失敗，請檢查網路。'; 
    }
}

function renderSelect() {
    const select = document.getElementById('itemSelect'); 
    const currentSelectedValue = select.value;
    select.innerHTML = '';
    if(Object.keys(dbItems).length === 0) {
        select.appendChild(Object.assign(document.createElement('option'), { value: "", text: "無花材資料，請先至後台進貨" }));
        return;
    }
    Object.keys(dbItems).forEach(name => { 
        select.appendChild(Object.assign(document.createElement('option'), { value: name, text: `${name} (單價:$${dbItems[name].price})` })); 
    });
    if (currentSelectedValue && dbItems[currentSelectedValue]) select.value = currentSelectedValue;
    updateStockHint();
}

function updateStockHint() {
    const name = document.getElementById('itemSelect').value; if(!name) return;
    const info = dbItems[name]; const hint = document.getElementById('stockHint');
    if(!info) return;
    if(info.stock <= 0) { 
        hint.style.color = '#d9534f'; hint.innerText = `⚠️ 目前雲端現貨庫存剩餘 ${info.stock} 支！(超賣或缺貨中)`; 
    } else { 
        hint.style.color = '#2e7d32'; hint.innerText = `💡 雲端系統顯示剩餘：${info.stock} 支`; 
    }
}

function togglePackageColor() { 
    document.getElementById('packageFieldsGroup').style.display = document.getElementById('needPackage').checked ? 'block' : 'none'; 
}

function addToCart() {
    const name = document.getElementById('itemSelect').value; if(!name) return;
    const qty = parseInt(document.getElementById('buyQty').value) || 0; if(qty <= 0) return;
    const info = dbItems[name]; if(!info) return;
    
    const maxStock = info.stock;
    const existing = cart.find(i => i.name === name);
    const targetQty = (existing ? existing.qty : 0) + qty;

    if (targetQty > maxStock) {
        if (!confirm(`⚠️ 庫存警報：${name} 雲端現貨僅剩 ${maxStock} 支，確認要強行加入購物車？`)) return;
    }
    if(existing) { existing.qty = targetQty; } else { cart.push({ name: name, qty: qty, price: info.price }); }
    renderCart();
}

function removeItem(name) { cart = cart.filter(i => i.name !== name); renderCart(); }

function renderCart() {
    const container = document.getElementById('cartContainer'); container.innerHTML = '';
    if(cart.length === 0) { 
        container.innerHTML = '<p style="text-align:center; color:#999; font-size:0.9em;">尚未選擇花材品項 🌸</p>'; 
        calculateGrandTotal(); return; 
    }
    cart.forEach(item => { 
        const subtotal = item.price * item.qty; 
        container.innerHTML += `<div class="cart-item"><div class="item-info"><div class="item-name">${item.name}</div><div class="item-meta">單價 $${item.price} × ${item.qty}支</div></div><div style="font-weight:bold; margin-right:15px; color:#b83b5e;">$${subtotal}</div><button class="btn-del" onclick="removeItem('${item.name}')">刪除</button></div>`; 
    });
    calculateGrandTotal();
}

function calculateGrandTotal() {
    let flowerSubtotal = 0;
    cart.forEach(item => { flowerSubtotal += item.price * item.qty; });
    let packageFee = document.getElementById('needPackage').checked ? (parseFloat(document.getElementById('packagePrice').value) || 0) : 0;
    let bagFee = document.getElementById('needBag').checked ? 50 : 0;
    const finalGrandTotal = flowerSubtotal + packageFee + bagFee;
    
    document.getElementById('lblFlowerTotal').innerText = flowerSubtotal;
    document.getElementById('lblPackageTotal').innerText = packageFee;
    document.getElementById('lblBagTotal').innerText = bagFee;
    document.getElementById('grandTotal').innerText = finalGrandTotal;
}

// 推播掛單指令至 GAS 中央總部，進行即時高併發扣減
async function submitCheckout() {
    const custName = document.getElementById('custName').value.trim(); 
    const custPhone = document.getElementById('custPhone').value.trim();
    if(!custName || !custPhone) { alert('請填寫客戶姓名與電話！'); return; }
    if(cart.length === 0) { alert('購物車內沒有選擇任何花材喔！'); return; }

    document.getElementById('syncStatus').innerText = '⚡ 正在向雲端遞交訂單並鎖定庫存...';

    const flowerSubtotal = parseInt(document.getElementById('lblFlowerTotal').innerText);
    const pPrice = parseInt(document.getElementById('lblPackageTotal').innerText);
    const bagPrice = parseInt(document.getElementById('lblBagTotal').innerText);
    const finalTotal = parseInt(document.getElementById('grandTotal').innerText);

    const orderObj = {
        id: 'ORD_' + Date.now(), 
        time: new Date().toLocaleTimeString('zh-TW'), 
        customer: custName, 
        phone: custPhone, 
        items: cart,
        flowerTotal: flowerSubtotal,   
        packagePrice: pPrice,          
        bagPrice: bagPrice,            
        finalTotal: finalTotal,        
        needPackage: document.getElementById('needPackage').checked,
        packageColor: document.getElementById('needPackage').checked ? document.getElementById('packageColor').value.trim() : "",
        needBag: document.getElementById('needBag').checked
    };
    
    try {
        await fetch(CLOUD_API, {
            method: "POST",
            body: JSON.stringify({ action: "submitOrder", order: orderObj })
        }).then(r => r.json());

        alert(`🎉 雲端掛單成功！花束總計為 $${finalTotal} 元。`);
        
        // 表單重置
        document.getElementById('custName').value = ''; document.getElementById('custPhone').value = '';
        document.getElementById('needPackage').checked = false; document.getElementById('needBag').checked = false;
        togglePackageColor(); 
        document.getElementById('packageColor').value = ''; document.getElementById('packagePrice').value = '300';
        cart = []; renderCart(); 
        await loadCloudStock();
    } catch(e) { alert("發送雲端點單失敗，請檢查網路連線。"); }
}

window.onfocus = function() { loadCloudStock(); };
window.onload = loadCloudStock;
</script>
</body>
</html>
